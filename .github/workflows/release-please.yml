# Seule pipeline du projet : à chaque push sur main, release-please lit les Conventional Commits et tient à jour
# une PR de release (version semver, CHANGELOG). La fusionner crée le tag et la release GitHub.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
